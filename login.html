<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Community Issue Reporter</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h2>🏙️ Smart Community Issue Reporter</h2>
    </header>

    <main class="auth-wrapper">

        <div class="auth-card">

            <h1>Welcome Back!</h1>

            <p class="auth-description">
                Login to access your community dashboard.
            </p>

            {% with messages = get_flashed_messages() %}
                {% for message in messages %}
                    <div class="flash-message">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                           placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="Enter your password" required>
                </div>

                <button type="submit">Login Securely</button>

            </form>

            <div class="auth-footer">
                Don't have an account?
                <a href="{{ url_for('register') }}">Register</a>
                <br><br>
                <a href="{{ url_for('home') }}">← Back to Home</a>
            </div>

        </div>

    </main>

    <footer>
        <p>Smart Community Issue Reporter</p>
    </footer>

</body>
</html>
